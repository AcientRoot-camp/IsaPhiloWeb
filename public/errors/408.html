<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#000000" />
    <title>408 Request timed out | IsaPhilo Enterprise</title>
    <link rel="icon" href="/isaphilo-favicon.png" type="image/png" />
    <style>
      :root {
        --ink: #1d1d1f;
        --muted: #5b5b61;
        --line: #e2e2e5;
        --bg: #f5f5f7;
        --green: #15803d;
        --green-dark: #166534;
        color: var(--ink);
        background: var(--bg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 24px 16px;
        place-items: center;
      }
      main {
        width: min(100%, 560px);
        padding: clamp(24px, 6vw, 44px);
        border: 1px solid var(--line);
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 1px 2px rgb(16 24 16 / 4%), 0 18px 40px -20px rgb(16 24 16 / 18%);
      }
      .brand {
        display: block;
        width: min(200px, 64%);
        height: auto;
        margin-bottom: 28px;
        /* Same recolour the site header applies to the logo file */
        filter: hue-rotate(280deg) saturate(1.1) brightness(1.25);
      }
      .code {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 14px;
        padding: 6px 12px;
        border-radius: 999px;
        background: #edfbf1;
        color: var(--green-dark);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.06em;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(28px, 7vw, 40px);
        letter-spacing: -0.03em;
        line-height: 1.1;
      }
      p { margin: 0 0 26px; color: var(--muted); font-size: 16px; line-height: 1.6; }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; }
      .btn {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        padding: 0 20px;
        border: 1px solid transparent;
        border-radius: 999px;
        font: inherit;
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
        transition: background-color 180ms ease, border-color 180ms ease;
      }
      .btn-primary { background: var(--green); color: #fff; }
      .btn-primary:hover { background: var(--green-dark); }
      .btn-secondary { border-color: var(--line); background: #fff; color: var(--ink); }
      .btn-secondary:hover { background: var(--bg); }
      .help {
        margin-top: 28px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 14px;
      }
      .help a { color: var(--green-dark); font-weight: 700; text-underline-offset: 3px; }
      a:focus-visible, button:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
      @media (max-width: 420px) { .btn { flex: 1 1 100%; } }
      @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
    </style>
  </head>
  <body>
    <main aria-labelledby="error-title">
      <a href="/" aria-label="IsaPhilo Enterprise home"><img class="brand" src="/isaphilo-logo.jpg" alt="IsaPhilo Enterprise" width="200" height="86" /></a>
      <p class="code">ERROR 408</p>
      <h1 id="error-title">Request timed out</h1>
      <p>The connection took too long. This can happen on slow mobile data — please try again.</p>
      <div class="actions">
        <button class="btn btn-primary" type="button" onclick="location.reload()">Try again</button>
        <a class="btn btn-secondary" href="/">Go to homepage</a>
      </div>
      <div class="help">
        Need materials now? Call <a href="tel:+233201928965">+233 20 192 8965</a>
        or <a href="https://wa.me/233201928965" target="_blank" rel="noreferrer">message us on WhatsApp</a>.
      </div>
    </main>
  </body>
</html>
