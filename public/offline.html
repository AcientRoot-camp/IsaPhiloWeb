<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f7" />
    <title>No internet connection | IsaPhilo Enterprise</title>
    <style>
      :root {
        color: #1d1d1f;
        background: #f5f5f7;
        font-family: Arial, Helvetica, sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
      }

      main {
        width: min(100%, 520px);
        padding: clamp(24px, 6vw, 40px);
        border: 1px solid #e2e2e5;
        border-radius: 24px;
        background: #fff;
      }

      .brand {
        display: block;
        width: min(220px, 72%);
        height: auto;
        margin-bottom: 32px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(28px, 7vw, 38px);
        letter-spacing: -0.04em;
        line-height: 1.1;
      }

      .error-code {
        margin: 0 0 12px;
        color: #12813b;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      p {
        margin: 0 0 24px;
        color: #5b5b61;
        font-size: 16px;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        padding: 0 18px;
        border-radius: 999px;
        background: #12813b;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 2px solid #1d1d1f;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="error-title">
      <img class="brand" src="/isaphilo-logo.jpg" alt="IsaPhilo Enterprise" />
      <p class="error-code">ERROR CODE: ERR_INTERNET_DISCONNECTED</p>
      <h1 id="error-title">Sorry!</h1>
      <p>No internet connection. Check your connection, then retry to continue.</p>
      <a href="/">Retry Again</a>
    </main>
  </body>
</html>
